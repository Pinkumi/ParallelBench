[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parallelbench"
version = "0.1.0"
description = "Reproducible CPU and CUDA numerical benchmarks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2", "matplotlib>=3.7", "threadpoolctl>=3.1"]

[project.optional-dependencies]
cuda = ["torch>=2.1"]
dev = ["pytest>=7"]

[project.scripts]
parallelbench = "parallelbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
